# Builds Hop for macOS and Windows when a version tag (v1.2.3) is
# pushed, and attaches the apps to that GitHub release. Installed copies check
# the latest release for updates:
# What people download (installer/ builds these):
#   macOS   -> Hop.dmg          (drag to Applications)
#   Windows -> Hop-Setup.exe    (setup wizard)
# What installed copies update from (keep these: every existing install uses them):
#   macOS   -> Hop-mac.zip      + .sha256
#   Windows -> Hop-windows.zip  + .sha256
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.2.0 (made from the chosen branch if it doesn't exist yet)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release stays a draft until both apps are attached, so the updater never
      # sees a published release that's missing a platform's zip.
      - name: Create the draft release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run by hand with a new tag: create it at this commit first, so the builds below can check it out.
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Hop ${TAG#v}" --generate-notes --verify-tag --draft

  build:
    needs: release
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from the tag
        run: echo "${TAG#v}" > VERSION
      - run: pip install pyinstaller certifi -r requirements.txt
      - run: python -m unittest discover tests
      - run: pyinstaller --noconfirm --log-level WARN Hop.spec
      - name: Smoke-test the built app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then python tests/smoke_app.py dist/Hop.app/Contents/MacOS/Hop
          else python tests/smoke_app.py dist/Hop/Hop.exe; fi
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent Hop.app Hop-mac.zip
          shasum -a 256 Hop-mac.zip > Hop-mac.zip.sha256
          cat Hop-mac.zip.sha256
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: installer/build_mac.sh Hop && installer/test_mac.sh Hop
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path Hop -DestinationPath Hop-windows.zip
          $h = (Get-FileHash Hop-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Hop-windows.zip" | Out-File -Encoding ascii -NoNewline Hop-windows.zip.sha256
          Get-Content Hop-windows.zip.sha256
      - name: Setup wizard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          installer/build_windows.ps1 -App Hop -Version $env:TAG -Url https://hop.pxlvzn.in
          installer/test_windows.ps1 -App Hop -Smoke "python tests/smoke_app.py"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then files="dist/Hop-mac.zip* dist/Hop.dmg*"
          else files="dist/Hop-windows.zip* dist/Hop-Setup.exe*"; fi
          gh release upload "$TAG" $files --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish once both apps are attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          for a in Hop-mac.zip Hop-mac.zip.sha256 Hop-windows.zip Hop-windows.zip.sha256 Hop.dmg Hop-Setup.exe; do
            echo "$assets" | grep -qx "$a" || { echo "missing $a, leaving the release as a draft"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
