<!doctype html>
<!-- Renders the Hop icon: "hop" in a heavy grotesk with a lime arc hopping over it.
     Same tile, gradient and type as the Dwn and Tag icons so the apps read as a family.
       node assets/make_icon.js && python assets/make_icon.py -->
<html><head><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .tile { position: absolute; left: 100px; top: 86px; width: 824px; height: 824px; border-radius: 185px;
    background: linear-gradient(#2b2b2b, #0e0e0e); box-shadow: 0 0 0 4px rgba(255,255,255,.08) inset, 0 18px 40px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; }
  .mark { position: relative; display: inline-block; font: 900 300px/1 "Inter Display", "Inter", sans-serif; letter-spacing: -.055em;
    color: #f5f5f5; padding-right: .055em; margin-top: 70px; }
  .arc { position: absolute; left: .06em; right: .16em; top: -.34em; height: .5em; border: .1em solid #ccff4d; border-bottom: 0;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .arc::after { content: ""; position: absolute; right: -.16em; bottom: -.12em; width: .22em; height: .22em; border-radius: 50%;
    background: #ccff4d; box-shadow: 0 0 0 .05em #191919; }
</style></head><body><div class="tile"><span class="mark">hop<i class="arc"></i></span></div></body></html>
